<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/logos/DurhamSoftball.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=t430123">
<title>Photos | Durham Softball</title>
<meta name="description" content="Game day photos from sixteen seasons of Durham Softball at Pineywood Park.">
</head>
<body>
<div data-header="photos.html"></div>
<div class="page-head">
  <img class="page-head-bg" src="/assets/Photos/2025-Spring-Softball-Champs.jpg" alt="">
  <div class="wrap">
    <div class="crumb">The album</div>
    <h1 class="h-lg">Photos</h1>
  </div>
</div>
<main class="section">
  <div class="wrap">
    <div class="toolbar">
      <select class="field" data-season-filter aria-label="Choose a season"></select>
      <span class="spacer"></span>
      <a class="btn btn-outline btn-sm" href="champions.html">Champions</a>
    </div>
    <div class="photo-grid-lg" id="gallery"></div>
    <p class="muted" id="gallery-note" style="margin-top:20px;font-size:.9rem"></p>
    <div class="center" style="margin-top:42px">
      <p class="muted" style="margin-bottom:16px">More photos go up on Facebook after most game days.</p>
      <a class="btn btn-outline" href="https://www.facebook.com/durhamsoftball" target="_blank" rel="noopener">Facebook album</a>
    </div>
  </div>
</main>
<div data-footer></div>
<script src="assets/js/config.js?v=t430123"></script>
<script src="assets/js/data.js?v=t430123"></script>
<script src="assets/js/api.js?v=t430123"></script>
<script src="assets/js/site.js?v=t430123"></script>
<script>
(function(){
  var PHOTOS=DS.PHOTOS, SEASONS=DS.PHOTO_SEASONS;
  var sel=document.querySelector('[data-season-filter]');
  sel.innerHTML='<option value="all">All photos</option>'+
    SEASONS.map(function(s){
      var n=PHOTOS.filter(function(p){return p.season===s.id;}).length;
      return '<option value="'+s.id+'">'+DSUI.esc(s.label)+' ('+n+')</option>';
    }).join('');

  function render(){
    var v=sel.value;
    var list=v==='all'?PHOTOS:PHOTOS.filter(function(p){return p.season===v;});
    document.getElementById('gallery').innerHTML = list.length
      ? DSUI.photoBand(list,{allowWide:true})
      : '<p class="center muted" style="grid-column:1/-1;padding:50px 0">No photos filed under that season yet.</p>';
    document.getElementById('gallery-note').textContent =
      list.length+' photo'+(list.length===1?'':'s')+'. Season tags come from the league\'s own file names, so a few may need correcting.';
  }
  function fillSeasons(){
    sel.innerHTML='<option value="all">All photos</option>'+
      SEASONS.map(function(s){
        var n=PHOTOS.filter(function(p){return p.season===s.id;}).length;
        return '<option value="'+s.id+'">'+DSUI.esc(s.label)+' ('+n+')</option>';
      }).join('');
  }

  sel.addEventListener('change',render);
  fillSeasons(); render();

  // If a database is connected, its photo library wins over the ones in data.js.
  if(DSAPI.configured()){
    DSAPI.listPhotos().then(function(rows){
      if(!rows || !rows.length) return;
      PHOTOS=rows.map(function(r){
        return { src:r.url, caption:r.caption||'', season:r.season_id||'unfiled', wide:r.is_wide };
      });
      var ids={};
      PHOTOS.forEach(function(p){ ids[p.season]=true; });
      SEASONS=Object.keys(ids).map(function(id){
        return { id:id, label: id==='unfiled' ? 'Unfiled' : id.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}) };
      });
      fillSeasons(); render();
    }).catch(function(){ /* keep the built-in photos */ });
  }
})();
</script>
</body>
</html>
