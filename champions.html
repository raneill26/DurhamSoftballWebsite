<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions | Durham Softball</title>
<meta name="description" content="Past champions of the Durham Softball league, with their winning check photos.">
<link rel="icon" href="assets/logos/DurhamSoftball.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=t513230">
</head>
<body>
<div data-header="photos.html"></div>
<div class="page-head">
  <img class="page-head-bg" src="assets/Photos/2025-Spring-Softball-Champs.jpg" alt="">
  <div class="wrap">
    <div class="crumb"><a href="photos.html">Photos</a></div>
    <h1 class="h-lg">Champions</h1>
    <p>Durham Softball Hall of Champions!</p>
  </div>
</div>
<main class="section">
  <div class="wrap">
    <div class="champ-grid" id="champs"></div>
    <div id="champ-note" style="margin-top:34px"></div>
  </div>
</main>
<div data-footer></div>
<script src="assets/js/config.js?v=t513230"></script>
<script src="assets/js/data.js?v=t513230"></script>
<script src="assets/js/api.js?v=t513230"></script>
<script src="assets/js/site.js?v=t513230"></script>
<script>
(function(){
  function draw(list){
  document.getElementById('champs').innerHTML = list.map(function(c){
    return '<figure class="champ">'+
      '<img src="'+c.photo+'" alt="'+DSUI.esc(c.caption||c.season)+'" loading="lazy">'+
      '<figcaption class="champ-body">'+
        '<div class="champ-season">'+DSUI.esc(c.season)+'</div>'+
        (c.team
          ? '<div class="champ-team">'+(c.league?c.league+' League: ':'')+DSUI.esc(c.team)+'</div>'
          : '<div class="champ-team">Winning team not recorded yet</div>')+
      '</figcaption></figure>';
  }).join('');
  }
  draw(DS.CHAMPIONS);

  if(DSAPI.configured()){
    DSAPI.listChampions().then(function(rows){
      if(!rows || !rows.length) return;
      draw(rows.map(function(r){
        return { season:r.label, league:r.league||'', team:r.team_name||'',
                 photo:r.photo_url||'', caption:r.caption||r.label };
      }));
    }).catch(function(){ /* keep the built-in list */ });
  }

  document.getElementById('champ-note').innerHTML =
    '<div class="champ-empty">'+
      '<h3 class="h-sm">Earlier seasons still to add</h3>'+
    '</div>';
})();
</script>
</body>
</html>
