<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/logos/DurhamSoftball.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=t506344">
<title>Schedule | Durham Softball</title>
<meta name="description" content="Full 2026 Summer schedule for Durham Softball. Every matchup shows the away and home team clearly labelled.">
</head>
<body>
<div data-header="schedule.html"></div>
<div class="page-head">
  <img class="page-head-bg" src="assets/Photos/softball.jpg" alt="">
  <div class="wrap">
    <div class="crumb">2026 Summer season</div>
    <h1 class="h-lg">Schedule</h1>
    <p>Eight Sundays at Pineywood Park, first pitch at 9:10 AM.</p>
  </div>
</div>
<main class="section">
  <div class="wrap">
    <div class="toolbar">
      <div class="seg" role="tablist" aria-label="Filter by league">
        <button role="tab" aria-selected="true" data-league="all">All games</button>
        <button role="tab" aria-selected="false" data-league="A">A League</button>
        <button role="tab" aria-selected="false" data-league="B">B League</button>
      </div>
      <select class="field" data-team-filter aria-label="Filter by team"></select>
      <span class="spacer"></span>
      <select class="field" data-week-jump aria-label="Jump to a week"></select>
    </div>
    <div id="schedule-out"></div>
    <p class="muted center" style="margin-top:34px">
      Rainouts and make-ups go out on the
      <a href="mailto:playncinc@gmail.com?subject=Add%20me%20to%20the%20Durham%20Softball%20newsletter" style="color:var(--clay)">newsletter</a>,
      <a href="https://x.com/PlayDurham" target="_blank" rel="noopener" style="color:var(--clay)">@PlayDurham</a>, and
      <a href="https://www.facebook.com/durhamsoftball" target="_blank" rel="noopener" style="color:var(--clay)">Facebook</a>.
    </p>
  </div>
</main>
<div data-footer></div>
<script src="assets/js/config.js?v=t506344"></script>
<script src="assets/js/data.js?v=t506344"></script>
<script src="assets/js/api.js?v=t506344"></script>
<script src="assets/js/site.js?v=t506344"></script>
<script>
(function(){
  var state={league:'all',team:'all'};
  var sel=document.querySelector('[data-team-filter]');
  sel.innerHTML='<option value="all">All teams</option>'+
    DS.TEAMS.slice().sort(function(a,b){return a.name.localeCompare(b.name);})
      .map(function(t){return '<option value="'+t.id+'">'+DSUI.esc(t.name)+'</option>';}).join('');

  var jump=document.querySelector('[data-week-jump]');
  jump.innerHTML='<option value="">Jump to week…</option>'+
    DS.SCHEDULE.map(function(d){return '<option value="week-'+d.week+'">Week '+d.week+' - '+
      DSUI.fmtDate(d.date,{month:'short',day:'numeric'})+'</option>';}).join('');
  jump.addEventListener('change',function(){
    if(!this.value) return;
    var t=document.getElementById(this.value); if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
  });

  var SCHEDULE = DS.SCHEDULE;

  function render(){
    var out=SCHEDULE.map(function(day){
      var games=day.games.filter(function(g){
        if(state.league!=='all'&&g.league!==state.league) return false;
        if(state.team!=='all'&&g.home!==state.team&&g.away!==state.team) return false;
        return true;
      });
      if(!games.length) return '';
      return '<section class="day-group" id="week-'+day.week+'">'+
        '<div class="day-head"><h3>'+DSUI.fmtDate(day.date,{weekday:'long',month:'long',day:'numeric'})+'</h3>'+
        '<span class="day-sub">Week '+day.week+' &middot; '+games.length+' game'+(games.length>1?'s':'')+'</span>'+
        '<span class="spacer"></span>'+
        (day.week===1?'<span class="pill pill-gold">Opening day</span>':'')+'</div>'+
        '<div class="grid grid-2">'+games.map(function(g){return DSUI.gameCard(g);}).join('')+'</div></section>';
    }).join('');
    document.getElementById('schedule-out').innerHTML = out ||
      '<p class="center muted" style="padding:60px 0">No games match those filters.</p>';
  }

  document.querySelectorAll('[data-league]').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('[data-league]').forEach(function(o){o.setAttribute('aria-selected','false');});
      b.setAttribute('aria-selected','true'); state.league=b.getAttribute('data-league'); render();
    });
  });
  sel.addEventListener('change',function(){state.team=this.value;render();});
  render();

  // A database schedule, once one exists, replaces the built-in fixtures.
  if(window.DSAPI && DSAPI.configured()){
    DSAPI.listGames().then(function(rows){
      if(!rows || !rows.length) return;
      var byDate={},order=[];
      rows.forEach(function(r){
        if(!byDate[r.game_date]){byDate[r.game_date]=[];order.push(r.game_date);}
        var h=parseInt(r.game_time.slice(0,2),10), m=r.game_time.slice(3,5);
        var ap=h>=12?'PM':'AM', h12=h%12||12;
        byDate[r.game_date].push({
          id:r.id, gameId:r.legacy_id, time:h12+':'+m+' '+ap, date:r.game_date,
          home:r.home_team, away:r.away_team, league:r.league,
          venue:r.venue||DS.SEASON.venue, placeholder:false,
          score: (r.home_score!=null&&r.away_score!=null)?{home:r.home_score,away:r.away_score}:null
        });
      });
      order.sort();
      SCHEDULE = order.map(function(d,i){ return {week:i+1,date:d,games:byDate[d]}; });
      render();
    }).catch(function(){ /* keep the built-in schedule */ });
  }
})();
</script>
</body>
</html>
